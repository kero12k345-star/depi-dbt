version: 2

models:
  - name: dim_customers
    description: "DWH layer: customer dimension built from stg_customers"
    columns:
      - name: customer_id
        description: "Customer key"
        tests:
          - unique
          - not_null
  - name: dim_country
    description: "Country dimension"
    columns:
      - name: country_key
        tests: [unique, not_null]
  - name: dim_department
    description: "Department dimension"
    columns:
      - name: department_key
        tests: [unique, not_null]
  - name: dim_gender
    description: "Gender dimension"
    columns:
      - name: gender_key
        tests: [unique, not_null]
  - name: dim_date
    description: "Hire date dimension"
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: dim_employee
    description: "Employee dimension"
    columns:
      - name: employee_key
        tests: [unique, not_null]
  - name: fact_employee
    description: "Fact table: one row per employee with dimension keys and salary"
    columns:
      - name: employee_key
        tests: [unique, not_null]
      - name: salary
        description: "Monthly salary"