version: 2

sources:
  - name: raw_data
    tables:
      - name: customers

models:
  - name: stg_customers
    description: "Staging layer: cleaned customers data from raw_data.customers"
    columns:
      - name: customer_id
        description: "Unique identifier of the customer"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer name after trimming extra spaces"
        tests:
          - not_null
      - name: email
        description: "Customer email address"
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the customer record was created"